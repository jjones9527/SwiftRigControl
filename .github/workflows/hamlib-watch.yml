name: Hamlib upstream watch

# Weekly Monday 12:00 UTC — polls the Hamlib upstream repository for
# new tags, published security advisories, and commits touching any
# file listed in HAMLIB_WATCH.md. If any signal is found, opens (or
# updates) a single issue titled "Hamlib upstream digest — <date>".
#
# Watermark: the last Hamlib commit reviewed is kept as a hidden
# `<!-- hamlib-watermark: <sha> -->` line at the end of each digest
# issue, and read back from the newest `hamlib-upstream` issue (open or
# closed) on the next run. It used to be committed to .hamlib-watermark
# on main, but main is a protected branch, so the push failed every
# week from 2026-10-26 and the watermark never moved.
# .hamlib-watermark in the repo is only the fallback when no digest
# issue carries a marker.
#
# Manual trigger via workflow_dispatch is supported for testing —
# a `dry-run` input skips the issue creation so you can inspect the
# digest output in the run log.

on:
  schedule:
    - cron: "0 12 * * MON"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run — emit digest to log without opening an issue"
        type: boolean
        default: false

concurrency:
  group: hamlib-watch
  cancel-in-progress: false

permissions:
  contents: read    # nothing is pushed
  issues: write     # open the digest issue and read the watermark

jobs:
  digest:
    name: Generate Hamlib upstream digest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out SwiftRigControl
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone Hamlib (last 500 commits)
        run: |
          git clone --depth=500 https://github.com/Hamlib/Hamlib.git /tmp/hamlib
        # 500 commits is well beyond Hamlib's weekly change volume.
        # The script deepens further only if the watermark falls
        # outside this window.

      - name: Restore watermark from the latest digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="$(gh issue list --label hamlib-upstream --state all --limit 20 \
                   --json number,body --jq 'sort_by(.number) | reverse | .[].body' \
                 | grep -oE '<!-- hamlib-watermark: [0-9a-f]{40} -->' \
                 | head -n1 | grep -oE '[0-9a-f]{40}' || true)"
          if [[ -n "$SHA" ]]; then
            echo "$SHA" > .hamlib-watermark
            echo "Watermark from digest issue: $SHA"
          else
            echo "No watermark marker in digest issues; using .hamlib-watermark ($(cat .hamlib-watermark))"
          fi

      - name: Run diff script
        id: diff
        env:
          HAMLIB_CLONE: /tmp/hamlib
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          Scripts/hamlib-diff.sh | tee /tmp/digest.md
          if [[ ! -s /tmp/digest.md ]]; then
            echo "digest_empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "digest_empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open (or update) digest issue
        if: steps.diff.outputs.digest_empty == 'false' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_SHA: ${{ steps.diff.outputs.new_head_sha }}
        run: |
          TITLE="Hamlib upstream digest — $(date -u +%Y-%m-%d)"

          # The next run starts from this issue's marker.
          if [[ -n "$NEW_SHA" ]]; then
            printf '\n<!-- hamlib-watermark: %s -->\n' "$NEW_SHA" >> /tmp/digest.md
          fi

          # If an open issue with the same title already exists this
          # week (rerun scenario), edit it instead of opening a
          # duplicate. Otherwise open fresh.
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number' || true)"

          if [[ -n "$EXISTING" ]]; then
            gh issue edit "$EXISTING" --body-file /tmp/digest.md
            echo "Updated existing issue #$EXISTING"
          else
            gh issue create \
              --title "$TITLE" \
              --body-file /tmp/digest.md \
              --label "hamlib-upstream"
          fi
